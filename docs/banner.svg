<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Quadeck</title>
  <desc id="d">Quadeck: the dashboard for a Podman home server. Containers, Quadlets, systemd, disks, shares, SSH and updates in one place.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4b8"/>
      <stop offset="1" stop-color="#4f8fbf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#7cc4b8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7cc4b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4b8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cc4b8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f252e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)" opacity="0.6"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="23.5" fill="none" stroke="#262c36"/>

  <!-- Logo, as in the app -->
  <g transform="translate(64 72) scale(2.75)">
    <rect width="32" height="32" rx="9" fill="url(#logo)"/>
    <g transform="translate(4 4)" fill="none" stroke="#0b0f14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 14h18l-2.5 5h-13z"/><path d="M6 14V9h4v5"/><path d="M12 14V6h5v8"/>
    </g>
  </g>

  <text x="178" y="126" fill="#e6edf3" font-family="'IBM Plex Sans Condensed', 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="0.5">Quadeck</text>
  <text x="180" y="166" fill="#9aa4b2" font-family="'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22">The dashboard for a Podman home server.</text>
  <text x="180" y="196" fill="#6e7986" font-family="'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17">Containers · Quadlets · systemd · disks · shares · SSH · updates. One binary, no container.</text>

  <!-- Feature chips -->
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#c9d1d9">
    <g transform="translate(180 236)">
      <rect width="118" height="32" rx="16" fill="#161c24" stroke="#2a323d"/>
      <circle cx="18" cy="16" r="4" fill="#56d364"/>
      <text x="32" y="21">quadlets</text>
    </g>
    <g transform="translate(310 236)">
      <rect width="104" height="32" rx="16" fill="#161c24" stroke="#2a323d"/>
      <circle cx="18" cy="16" r="4" fill="#56d364"/>
      <text x="32" y="21">systemd</text>
    </g>
    <g transform="translate(426 236)">
      <rect width="86" height="32" rx="16" fill="#161c24" stroke="#2a323d"/>
      <circle cx="18" cy="16" r="4" fill="#e3b341"/>
      <text x="32" y="21">smart</text>
    </g>
    <g transform="translate(524 236)">
      <rect width="112" height="32" rx="16" fill="#161c24" stroke="#2a323d"/>
      <circle cx="18" cy="16" r="4" fill="#56d364"/>
      <text x="32" y="21">smb · nfs</text>
    </g>
    <g transform="translate(648 236)">
      <rect width="62" height="32" rx="16" fill="#161c24" stroke="#2a323d"/>
      <circle cx="18" cy="16" r="4" fill="#56d364"/>
      <text x="32" y="21">ssh</text>
    </g>
  </g>

  <!-- Mini dashboard card on the right -->
  <g transform="translate(884 56)">
    <rect width="332" height="248" rx="16" fill="#0e1319" stroke="#262c36"/>
    <!-- CPU gauge -->
    <g transform="translate(28 30)">
      <circle cx="30" cy="30" r="24" fill="none" stroke="#1f252e" stroke-width="6"/>
      <circle cx="30" cy="30" r="24" fill="none" stroke="#7cc4b8" stroke-width="6" stroke-linecap="round" stroke-dasharray="47 151" transform="rotate(-90 30 30)"/>
      <text x="30" y="35" text-anchor="middle" fill="#e6edf3" font-family="'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">31%</text>
    </g>
    <text x="104" y="48" fill="#6e7986" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">CPU</text>
    <text x="104" y="76" fill="#e6edf3" font-family="'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">31 %</text>
    <text x="104" y="96" fill="#6e7986" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11">4 cores · load 0.22</text>
    <!-- sparkline -->
    <path d="M28 150 C60 146 80 158 110 150 S150 140 180 148 S230 160 260 150 S310 142 328 152 V190 H28 Z" fill="url(#spark)"/>
    <path d="M28 150 C60 146 80 158 110 150 S150 140 180 148 S230 160 260 150 S310 142 328 152" fill="none" stroke="#7cc4b8" stroke-width="2" stroke-linecap="round"/>
    <!-- service tiles -->
    <g transform="translate(28 204)" font-family="'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">
      <rect width="96" height="28" rx="8" fill="#161c24" stroke="#2a323d"/><circle cx="14" cy="14" r="4" fill="#56d364"/><text x="26" y="18">Jellyfin</text>
      <rect x="104" width="96" height="28" rx="8" fill="#161c24" stroke="#2a323d"/><circle cx="118" cy="14" r="4" fill="#56d364"/><text x="130" y="18">Immich</text>
      <rect x="208" width="92" height="28" rx="8" fill="#161c24" stroke="#2a323d"/><circle cx="222" cy="14" r="4" fill="#ff8a80"/><text x="234" y="18">Backup</text>
    </g>
  </g>
</svg>
