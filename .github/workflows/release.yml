name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Version matches tag
        run: test "v$(jq -r .version package.json)" = "${GITHUB_REF_NAME}"
      - run: bun run typecheck && bun run test
      - run: bun scripts/compile.ts bun-linux-x64-baseline bun-linux-arm64 bun-linux-x64-musl bun-linux-arm64-musl
      - name: Checksums
        run: cd release && sha256sum quadeck-linux-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/quadeck-linux-* release/SHA256SUMS install.sh --generate-notes
