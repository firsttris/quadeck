name: Release

# A tag vX.Y.Z (the button in bump.yml or bun run release:patch|minor|major) publishes that
# version: typecheck and tests, the four binaries with SHA256SUMS, then the shared GitHub release
# from firsttris/workflows, which checks the tag against package.json and attaches the binaries and
# install.sh. Run by hand on main: only the build, nothing is released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run test
      - run: bun scripts/compile.ts bun-linux-x64-baseline bun-linux-arm64 bun-linux-x64-musl bun-linux-arm64-musl
      - name: Checksums
        run: cd release && sha256sum quadeck-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/quadeck-linux-*
            release/SHA256SUMS
            install.sh
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      release-artifact: release
    permissions:
      contents: write
