name: CI

# Changes to documentation alone don't build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_call: # release.yml runs the same checks before publishing
  workflow_dispatch:

permissions:
  contents: read

# Same header as every project, see https://github.com/firsttris/workflows#ci-in-every-project
# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The Bun the release binaries are compiled with (Renovate, .github/renovate.json5)
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # tests/backup.test.ts runs against the real restic
      - uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: restic
          recommends: "false"
      - run: bunx biome ci
      - run: bun run typecheck
      - run: bun run test
      - name: Binary builds
        run: bun scripts/compile.ts bun-linux-x64-baseline bun-linux-arm64 bun-linux-x64-musl bun-linux-arm64-musl
      - name: Smoke test (glibc)
        run: ./release/quadeck-linux-x64-baseline version
      - uses: actions/upload-artifact@v4
        with:
          name: release-x64
          path: |
            release/quadeck-linux-x64-baseline
            release/quadeck-linux-x64-musl
          retention-days: 3

  # The official Playwright image of the @playwright/test version in bun.lock: browser, system
  # libraries and fonts come with it, no playwright install.
  playwright-image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # The E2E tests share one server and its data directory, so they run one after the other. Split
  # by file across four runners, each building and starting its own server, they finish alongside
  # the checks above. e2e/zz-i18n.spec.ts switches to English and has to come last: shards take the
  # files in name order, so it stays at the end of the last one. Shards are cut by test count, not
  # time: e2e/dashboard.spec.ts (28 short tests, ~100 s) fills the first one alone, and with three
  # the last shard ran 216 s of tests against 122 s for the first; with four the longest is ~160 s.
  e2e:
    name: E2E ${{ matrix.shard }}/4
    needs: playwright-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global bun
      - run: bun install --frozen-lockfile
      - name: E2E (production build against fixtures)
        run: bunx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/

  # The release binary in a bare container of each distribution: it starts, finds the
  # distribution and its package manager (quadeck doctor) and serves the web app.
  distros:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Fedora, image: 'fedora:latest', id: fedora, pm: dnf }
          - { name: Debian 12, image: 'debian:12', id: debian, pm: apt }
          - { name: Debian 13, image: 'debian:13', id: debian, pm: apt }
          - { name: Ubuntu 22.04, image: 'ubuntu:22.04', id: ubuntu, pm: apt }
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', id: ubuntu, pm: apt }
          - { name: Arch Linux, image: 'archlinux:latest', id: arch, pm: pacman }
          - { name: openSUSE Tumbleweed, image: 'opensuse/tumbleweed:latest', id: opensuse, pm: zypper }
          - { name: Rocky Linux 9, image: 'rockylinux/rockylinux:9', id: rhel, pm: dnf }
          # MicroOS: read-only root with transactional-update (a stand-in script; only detection is tested)
          - { name: openSUSE MicroOS (simulated), image: 'opensuse/tumbleweed:latest', id: opensuse, pm: transactional-update, args: '--read-only --tmpfs /tmp -v /tmp/fakebin:/opt/fake:ro -e PATH=/opt/fake:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' }
          - { name: Alpine (musl), image: 'alpine:3.20', id: alpine, pm: apk, musl: true, prep: 'apk add --no-cache libstdc++ libgcc' }
    name: Runs on ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-x64
          path: release
      - run: chmod +x release/*
      - name: Stand-in transactional-update
        run: mkdir -p /tmp/fakebin && printf '#!/bin/sh\necho stand-in\n' > /tmp/fakebin/transactional-update && chmod +x /tmp/fakebin/transactional-update
      - name: Smoke test
        run: |
          bin=quadeck-linux-x64-${{ matrix.musl && 'musl' || 'baseline' }}
          docker run --rm -v "$PWD:/w:ro" -w /w ${{ matrix.args }} ${{ matrix.image }} \
            sh -c "${{ matrix.prep || 'true' }} && ./scripts/smoke-distro.sh /w/release/$bin ${{ matrix.id }} ${{ matrix.pm }}"
