# Documentation as a website: https://firsttris.github.io/quadeck/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: Quadeck
site_description: >-
  Self-hosted web UI for Podman Quadlets and systemd: containers, units, updates,
  disks, backups, shares, SSH and network of a home server in one place.
site_url: https://firsttris.github.io/quadeck/
repo_url: https://github.com/firsttris/quadeck
repo_name: firsttris/quadeck
edit_uri: edit/main/docs/
copyright: License MIT

docs_dir: docs
# Pages as backups.html instead of backups/: keeps the relative image paths of
# the <img> tags right, which also have to work on GitHub
use_directory_urls: false
exclude_docs: |
  banner.svg
  social-preview.png

nav:
  - Overview: README.md
  - Getting started:
      - Installation: installation.md
      - Overview and services: dashboard.md
  - Services:
      - Units and Quadlets: quadlets.md
      - systemd editor and timers: systemd.md
      - Updates and packages: updates.md
  - Storage:
      - Disks and files: disks.md
      - Backups: backups.md
      - Shares: shares.md
  - Server:
      - Hardware: hardware.md
      - Users: users.md
      - SSH: ssh.md
      - Terminal: terminal.md
      - Network: network.md
      - Notifications: notifications.md
  - Background:
      - Security: security.md
      - Development: development.md

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the system setting, switchable
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
      locale: en
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Same anchors as on GitHub (lowercase, Unicode kept)
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/quadeck
      name: Source on GitHub
    - icon: material/download
      link: https://github.com/firsttris/quadeck/releases/latest
      name: Latest release
