[global]
   workgroup = WORKGROUP
   server string = nas-01

[homes]
   browseable = no

[Medien]
   path = /mnt/storage/media
   read only = yes
   guest ok = yes

[Fotos]
   path = /mnt/storage/photos
   writable = yes
   valid users = @family

[printers]
   path = /var/spool/samba
   printable = yes
